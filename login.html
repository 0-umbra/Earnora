<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — Earnora</title>

<meta name="description" content="Login to your Earnora account.">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #050505;
        color: #ffffff;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
    }

    /* HEADER */

    header {
        width: 100%;
        padding: 18px 7%;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background: #050505;
        border-bottom: 1px solid #222222;
    }

    .logo {
        text-decoration: none;
        color: #ffffff;

        font-size: 27px;
        font-weight: 900;

        letter-spacing: 1px;
    }

    .logo span {
        color: #e53935;
    }

    .home-link {
        color: #aaaaaa;
        text-decoration: none;

        font-size: 14px;

        transition: 0.2s ease;
    }

    .home-link:hover {
        color: #ffffff;
    }

    /* LOGIN AREA */

    .login-section {
        flex: 1;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 50px 20px;

        background:
            radial-gradient(
                circle at 25% 25%,
                rgba(229, 57, 53, 0.10),
                transparent 30%
            ),
            radial-gradient(
                circle at 75% 70%,
                rgba(30, 136, 229, 0.10),
                transparent 30%
            ),
            #050505;
    }

    .login-box {
        width: 100%;
        max-width: 430px;

        padding: 38px 32px;

        background: #101010;

        border: 1px solid #292929;
        border-radius: 18px;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .login-title {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-title h1 {
        font-size: 30px;
        margin-bottom: 9px;
    }

    .login-title p {
        color: #8f8f8f;
        font-size: 14px;
    }

    /* FORM */

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;

        margin-bottom: 8px;

        color: #dddddd;

        font-size: 14px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;

        padding: 14px 15px;

        background: #080808;
        color: #ffffff;

        border: 1px solid #303030;
        border-radius: 9px;

        outline: none;

        font-size: 15px;

        transition: 0.2s ease;
    }

    .form-group input:focus {
        border-color: #1e88e5;
        box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.10);
    }

    .forgot {
        display: block;

        text-align: right;

        margin-top: -7px;
        margin-bottom: 22px;

        color: #4da3ff;

        text-decoration: none;

        font-size: 13px;
    }

    .forgot:hover {
        color: #75b9ff;
    }

    /* LOGIN BUTTON */

    .login-button {
        width: 100%;

        padding: 14px;

        border: none;
        border-radius: 9px;

        background: #e53935;
        color: #ffffff;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        transition: 0.2s ease;
    }

    .login-button:hover {
        background: #ff4743;
        transform: translateY(-1px);
    }

    /* DIVIDER */

    .divider {
        display: flex;
        align-items: center;

        gap: 12px;

        margin: 25px 0;

        color: #666666;

        font-size: 12px;
    }

    .divider::before,
    .divider::after {
        content: "";

        flex: 1;

        height: 1px;

        background: #292929;
    }

    /* SIGN UP */

    .signup-text {
        text-align: center;

        color: #888888;

        font-size: 14px;
    }

    .signup-text a {
        color: #1e88e5;

        text-decoration: none;

        font-weight: 600;
    }

    .signup-text a:hover {
        color: #5aa9ff;
    }

    /* FOOTER */

    footer {
        padding: 22px 20px;

        text-align: center;

        background: #030303;

        border-top: 1px solid #1b1b1b;

        color: #666666;

        font-size: 12px;
    }

    footer strong {
        color: #ffffff;
    }

    /* MOBILE */

    @media (max-width: 500px) {

        header {
            padding: 16px 5%;
        }

        .logo {
            font-size: 23px;
        }

        .login-box {
            padding: 30px 22px;
        }

        .login-title h1 {
            font-size: 27px;
        }
    }
</style>

</head><body><!-- HEADER -->

<header>

    <a href="index.html" class="logo">
        Earn<span>ora</span>
    </a>

    <a href="index.html" class="home-link">
        ← Home
    </a>

</header>


<!-- LOGIN -->

<main class="login-section">

    <div class="login-box">

        <div class="login-title">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue to Earnora.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <a href="#" class="forgot">
                Forgot password?
            </a>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <p class="signup-text">

            Don't have an account?

            <a href="signup.html">
                Create one
            </a>

        </p>

    </div>

</main>


<!-- FOOTER -->

<footer>

    © 2026 <strong>Earnora</strong>. All rights reserved.

</footer>


<!-- TEMPORARY FORM BEHAVIOR -->

<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            alert(
                "The login system will be connected in the next step."
            );

        });

</script>

</body>
  </html>
